<!DOCTYPE html>
<html lang="en" class="bg-[#09090c] text-zinc-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeFlux — Admin Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'JetBrains Mono', monospace; }</style>
</head>
<body class="p-6 max-w-xl mx-auto min-h-screen flex flex-col justify-center">

  <div class="bg-[#13131a] border border-white/10 p-6 sm:p-8 rounded-2xl shadow-2xl">
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/10">
      <h1 class="text-lg font-bold text-indigo-400">CodeFlux Admin</h1>
      <a href="index.html" class="text-xs text-zinc-400 hover:text-white">← View Site</a>
    </div>

    <form id="project-form" class="space-y-4">
      <div>
        <label class="text-xs text-zinc-400 block mb-1">Project Title</label>
        <input id="title" required class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-indigo-500 outline-none" placeholder="e.g. Modern E-Commerce Platform" />
      </div>

      <div>
        <label class="text-xs text-zinc-400 block mb-1">Category / Tag</label>
        <input id="category" required class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-indigo-500 outline-none" placeholder="e.g. Web Application" />
      </div>

      <div>
        <label class="text-xs text-zinc-400 block mb-1">Badge Tag</label>
        <input id="badge" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-indigo-500 outline-none" placeholder="e.g. Full-Stack / Live App" />
      </div>

      <!-- Updated Image Upload Section with ImgBB -->
      <div>
        <label class="text-xs text-zinc-400 block mb-1">Project Image (Upload from Gallery or Paste URL)</label>
        <div class="flex gap-2">
          <label for="image-upload" class="cursor-pointer bg-[#1e1e24] hover:bg-[#2a2a32] border border-white/10 rounded-lg px-3 py-2 text-sm text-indigo-400 transition flex items-center justify-center whitespace-nowrap">
            📁 Upload
          </label>
          <input type="file" id="image-upload" accept="image/*" class="hidden" />
          <input id="image" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-indigo-500 outline-none" placeholder="https://..." />
        </div>
        <p id="upload-status" class="text-[10px] text-zinc-500 mt-2 hidden">Uploading...</p>
      </div>

      <div>
        <label class="text-xs text-zinc-400 block mb-1">Live Demo Link</label>
        <input id="link" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-indigo-500 outline-none" placeholder="https://..." />
      </div>

      <div>
        <label class="text-xs text-zinc-400 block mb-1">Description</label>
        <textarea id="description" required rows="3" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-indigo-500 outline-none" placeholder="Key features & stack..."></textarea>
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition text-sm mt-4">
        Publish Project to Live Site
      </button>
    </form>
    <p id="status-msg" class="text-xs text-emerald-400 text-center mt-3 hidden">✓ Project published successfully!</p>
  </div>

  <!-- ImgBB Upload Script -->
  <script>
    const imgbbAPIKey = 'b2e3e11a759c688b24a98845652dfb95';
    const imageUploadInput = document.getElementById('image-upload');
    const imageUrlInput = document.getElementById('image');
    const uploadStatus = document.getElementById('upload-status');

    imageUploadInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Show loading status
      uploadStatus.classList.remove('hidden');
      uploadStatus.innerText = "⏳ Uploading image to ImgBB...";
      uploadStatus.className = "text-[10px] text-yellow-500 mt-2";

      const formData = new FormData();
      formData.append('image', file);

      try {
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbAPIKey}`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        if (data.success) {
          imageUrlInput.value = data.data.url; // Auto-fill the input box with the link
          uploadStatus.innerText = "✅ Image uploaded successfully!";
          uploadStatus.className = "text-[10px] text-emerald-400 mt-2";
        } else {
          throw new Error('Upload failed');
        }
      } catch (error) {
        uploadStatus.innerText = "❌ Upload failed. Please try again or paste the URL manually.";
        uploadStatus.className = "text-[10px] text-red-400 mt-2";
      }
    });
  </script>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Your exact Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDW95p_4YPfHo9vvTHwP07fAcrL20UDS7c",
      authDomain: "codeflux-db.firebaseapp.com",
      projectId: "codeflux-db",
      storageBucket: "codeflux-db.firebasestorage.app",
      messagingSenderId: "113608499003",
      appId: "1:113608499003:web:e73b527a3a3afe1ec2211e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('project-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.innerText = "Publishing...";
      btn.disabled = true;

      const newProject = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        badge: document.getElementById('badge').value || 'Launch',
        image: document.getElementById('image').value, // Grabs the URL generated by ImgBB
        link: document.getElementById('link').value,
        description: document.getElementById('description').value,
        createdAt: Date.now()
      };

      try {
        await push(ref(db, 'projects'), newProject);
        document.getElementById('status-msg').classList.remove('hidden');
        document.getElementById('project-form').reset();
        document.getElementById('upload-status').classList.add('hidden'); // Reset upload status text
      } catch (err) {
        alert("Database error: Make sure Realtime Database is created and set to Test Mode.");
      } finally {
        btn.innerText = "Publish Project to Live Site";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
